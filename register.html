<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QRGuard | Create Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #f5f5f5;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(112, 67, 190, 0.24),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 12%,
                    rgba(255, 193, 7, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(84, 44, 140, 0.15),
                    transparent 42%
                ),
                linear-gradient(
                    135deg,
                    #03050a,
                    #080d1b 52%,
                    #09050f
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;
        }


        .glow-one {
            position: fixed;

            width: 280px;
            height: 280px;

            left: -130px;
            bottom: -120px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,193,7,0.08),
                    transparent 70%
                );

            pointer-events: none;
        }


        .glow-two {
            position: fixed;

            width: 260px;
            height: 260px;

            right: -120px;
            top: -110px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(113,67,190,0.13),
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =========================================
           REGISTER CARD
        ========================================= */

        .register-card {
            width: min(450px, 100%);

            padding: 34px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17,20,36,0.96),
                    rgba(10,8,20,0.96)
                );

            border:
                1px solid rgba(255,255,255,0.09);

            box-shadow:
                0 35px 90px rgba(0,0,0,0.55),
                0 0 55px rgba(105,62,175,0.13);

            backdrop-filter: blur(22px);

            position: relative;

            z-index: 2;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo-area {
            text-align: center;

            margin-bottom: 25px;
        }


        .logo {
            width: 66px;
            height: 66px;

            margin: 0 auto 14px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 19px;

            font-size: 32px;

            background:
                linear-gradient(
                    145deg,
                    #1b1834,
                    #090a12
                );

            border:
                1px solid rgba(255,193,7,0.42);

            color: #ffc107;

            box-shadow:
                0 0 35px rgba(110,64,180,0.20);
        }


        .brand {
            font-size: 26px;

            font-weight: 900;

            letter-spacing: 0.3px;
        }


        .brand span {
            color: #ffc107;
        }


        .tagline {
            margin-top: 6px;

            color: #818a9d;

            font-size: 11px;
        }


        /* =========================================
           TITLE
        ========================================= */

        .title {
            text-align: center;

            margin-bottom: 20px;
        }


        .title h1 {
            margin: 0 0 7px;

            font-size: 24px;
        }


        .title p {
            margin: 0;

            color: #858ea0;

            font-size: 12px;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error {
            margin-bottom: 16px;

            padding: 11px 13px;

            border-radius: 10px;

            color: #ff9ca3;

            background:
                rgba(220,53,69,0.09);

            border:
                1px solid rgba(220,53,69,0.23);

            font-size: 12px;

            line-height: 1.5;
        }


        /* =========================================
           FORM
        ========================================= */

        .field {
            margin-bottom: 14px;
        }


        .field label {
            display: block;

            margin-bottom: 7px;

            color: #c9cfda;

            font-size: 12px;

            font-weight: 700;
        }


        .field input {
            width: 100%;

            padding: 12px 14px;

            border-radius: 11px;

            outline: none;

            color: #f0f2f6;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid rgba(255,255,255,0.09);

            font-size: 13px;

            transition: 0.2s;
        }


        .field input::placeholder {
            color: #596274;
        }


        .field input:focus {
            border-color:
                rgba(255,193,7,0.45);

            box-shadow:
                0 0 0 3px rgba(255,193,7,0.06);
        }


        /* =========================================
           CREATE BUTTON
        ========================================= */

        .create-btn {
            width: 100%;

            border: none;

            padding: 14px;

            margin-top: 4px;

            border-radius: 11px;

            cursor: pointer;

            color: #080a10;

            background:
                linear-gradient(
                    135deg,
                    #ffc107,
                    #dfa300
                );

            font-size: 13px;

            font-weight: 900;

            box-shadow:
                0 10px 28px rgba(255,193,7,0.14);

            transition: 0.2s;
        }


        .create-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 32px rgba(255,193,7,0.20);
        }


        /* =========================================
           DIVIDER
        ========================================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 21px 0;
        }


        .divider-line {
            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,0.08);
        }


        .divider span {
            color: #697285;

            font-size: 10px;

            font-weight: 700;
        }


        /* =========================================
           GOOGLE
        ========================================= */

        .google-btn {
            width: 100%;

            min-height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            text-decoration: none;

            border-radius: 11px;

            color: #e8ebf0;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid rgba(255,255,255,0.11);

            font-size: 13px;

            font-weight: 800;

            transition: 0.2s;
        }


        .google-btn:hover {
            background:
                rgba(255,255,255,0.075);

            border-color:
                rgba(255,193,7,0.25);

            transform: translateY(-1px);
        }


        .google-icon {
            width: 20px;
            height: 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: white;

            color: #4285f4;

            font-size: 13px;

            font-weight: 900;
        }


        /* =========================================
           LOGIN LINK
        ========================================= */

        .login-link {
            text-align: center;

            margin-top: 21px;

            color: #737d90;

            font-size: 12px;
        }


        .login-link a {
            color: #ffc107;

            text-decoration: none;

            font-weight: 800;
        }


        .login-link a:hover {
            text-decoration: underline;
        }


        /* =========================================
           SECURITY
        ========================================= */

        .security {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 21px;

            color: #626c7e;

            font-size: 10px;

            text-align: center;
        }


        .security span {
            color: #ffc107;
        }


        .footer {
            text-align: center;

            margin-top: 19px;

            color: #4f586a;

            font-size: 10px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }


            .register-card {
                padding: 27px 21px;

                border-radius: 21px;
            }


            .brand {
                font-size: 23px;
            }


            .logo {
                width: 60px;
                height: 60px;

                font-size: 29px;
            }

        }

    </style>

</head>


<body>


<div class="glow-one"></div>
<div class="glow-two"></div>


<main class="register-card">


    <!-- =====================================
         LOGO
    ====================================== -->

    <div class="logo-area">

        <div class="logo">
            🛡
        </div>


        <div class="brand">
            QR<span>Guard</span>
        </div>


        <div class="tagline">
            QR-Code Phishing Detection System
        </div>

    </div>



    <!-- =====================================
         TITLE
    ====================================== -->

    <div class="title">

        <h1>
            Create Account
        </h1>

        <p>
            Join QRGuard and protect yourself from suspicious QR links
        </p>

    </div>



    <!-- =====================================
         ERROR
    ====================================== -->

    {% if error %}

        <div class="error">
            ⚠ {{ error }}
        </div>

    {% endif %}



    <!-- =====================================
         REGISTER FORM
    ====================================== -->

    <form
        method="POST"
        action="{{ url_for('register') }}"
    >


        <div class="field">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                autocomplete="username"
                minlength="3"
                maxlength="50"
                required
            >

        </div>


        <div class="field">

            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <div class="field">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <div class="field">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            class="create-btn"
        >
            👤 Create Account
        </button>


    </form>



    <!-- =====================================
         DIVIDER
    ====================================== -->

    <div class="divider">

        <div class="divider-line"></div>

        <span>
            OR
        </span>

        <div class="divider-line"></div>

    </div>



    <!-- =====================================
         GOOGLE SIGN UP
    ====================================== -->

    <a
        href="{{ url_for('google_login') }}"
        class="google-btn"
    >

        <div class="google-icon">
            G
        </div>

        Continue with Google

    </a>



    <!-- =====================================
         LOGIN
    ====================================== -->

    <div class="login-link">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Sign In
        </a>

    </div>



    <!-- =====================================
         SECURITY
    ====================================== -->

    <div class="security">

        <span>🛡</span>

        Secure authentication · QRGuard

    </div>


    <div class="footer">

        QRGuard © 2026

    </div>


</main>


</body>
</html>
