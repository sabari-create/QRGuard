<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="google-site-verification"
          content="bdFd29_fwLQDwspw717PsfaTVk0j3h4SZpwQvOM57-Q">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QRGuard | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #f5f5f5;

            background:
                radial-gradient(circle at 15% 15%,
                    rgba(112, 67, 190, 0.24),
                    transparent 35%),
                radial-gradient(circle at 85% 12%,
                    rgba(255, 193, 7, 0.12),
                    transparent 30%),
                radial-gradient(circle at 50% 100%,
                    rgba(84, 44, 140, 0.15),
                    transparent 42%),
                linear-gradient(135deg,
                    #03050a,
                    #080d1b 52%,
                    #09050f);

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .glow-one {
            position: fixed;
            width: 280px;
            height: 280px;
            left: -130px;
            bottom: -120px;
            border-radius: 50%;
            background:
                radial-gradient(circle,
                    rgba(255,193,7,0.08),
                    transparent 70%);
            pointer-events: none;
        }

        .glow-two {
            position: fixed;
            width: 260px;
            height: 260px;
            right: -120px;
            top: -110px;
            border-radius: 50%;
            background:
                radial-gradient(circle,
                    rgba(113,67,190,0.13),
                    transparent 70%);
            pointer-events: none;
        }

        .login-card {
            width: min(430px, 100%);
            padding: 36px;

            border-radius: 25px;

            background:
                linear-gradient(145deg,
                    rgba(17,20,36,0.96),
                    rgba(10,8,20,0.96));

            border: 1px solid rgba(255,255,255,0.09);

            box-shadow:
                0 35px 90px rgba(0,0,0,0.55),
                0 0 55px rgba(105,62,175,0.13);

            backdrop-filter: blur(22px);

            position: relative;
            z-index: 2;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            font-size: 34px;

            background:
                linear-gradient(145deg,
                    #1b1834,
                    #090a12);

            border: 1px solid rgba(255,193,7,0.42);

            color: #ffc107;

            box-shadow:
                0 0 35px rgba(110,64,180,0.20);
        }

        .brand {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 0.3px;
        }

        .brand span {
            color: #ffc107;
        }

        .tagline {
            margin-top: 7px;
            color: #818a9d;
            font-size: 12px;
        }

        .title {
            text-align: center;
            margin-bottom: 23px;
        }

        .title h1 {
            margin: 0 0 7px;
            font-size: 25px;
        }

        .title p {
            margin: 0;
            color: #858ea0;
            font-size: 13px;
        }

        .error {
            margin-bottom: 17px;
            padding: 12px 14px;
            border-radius: 10px;

            color: #ff9ca3;

            background:
                rgba(220,53,69,0.09);

            border: 1px solid rgba(220,53,69,0.23);

            font-size: 12px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;

            color: #c9cfda;

            font-size: 12px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;

            border-radius: 11px;
            outline: none;

            color: #f0f2f6;

            background:
                rgba(255,255,255,0.045);

            border: 1px solid rgba(255,255,255,0.09);

            font-size: 13px;
            transition: 0.2s;
        }

        .field input::placeholder {
            color: #596274;
        }

        .field input:focus {
            border-color:
                rgba(255,193,7,0.45);

            box-shadow:
                0 0 0 3px rgba(255,193,7,0.06);
        }

        .login-btn {
            width: 100%;
            border: none;

            padding: 14px;
            border-radius: 11px;

            cursor: pointer;

            color: #080a10;

            background:
                linear-gradient(135deg,
                    #ffc107,
                    #dfa300);

            font-size: 13px;
            font-weight: 900;

            box-shadow:
                0 10px 28px rgba(255,193,7,0.14);

            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 32px rgba(255,193,7,0.20);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;

            background:
                rgba(255,255,255,0.08);
        }

        .divider span {
            color: #697285;
            font-size: 11px;
            font-weight: 700;
        }

        .google-btn {
            width: 100%;
            min-height: 47px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;

            text-decoration: none;

            border-radius: 11px;

            color: #e8ebf0;

            background:
                rgba(255,255,255,0.045);

            border: 1px solid rgba(255,255,255,0.11);

            font-size: 13px;
            font-weight: 800;

            transition: 0.2s;
        }

        .google-btn:hover {
            background:
                rgba(255,255,255,0.075);

            border-color:
                rgba(255,193,7,0.25);

            transform: translateY(-1px);
        }

        .google-icon {
            width: 20px;
            height: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: white;
            color: #4285f4;

            font-size: 13px;
            font-weight: 900;
        }

        .register {
            text-align: center;
            margin-top: 22px;

            color: #737d90;

            font-size: 12px;
        }

        .register a {
            color: #ffc107;
            text-decoration: none;
            font-weight: 800;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .security {
            margin-top: 22px;
            padding: 11px 12px;

            border-radius: 10px;

            text-align: center;

            color: #6f788b;

            background:
                rgba(255,255,255,0.025);

            border: 1px solid rgba(255,255,255,0.06);

            font-size: 10px;
            line-height: 1.5;
        }

        .security strong {
            color: #9da5b5;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            .brand {
                font-size: 24px;
            }

            .title h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="glow-one"></div>
    <div class="glow-two"></div>

    <div class="login-card">

        <div class="logo-area">

            <div class="logo">
                🛡️
            </div>

            <div class="brand">
                QR<span>Guard</span>
            </div>

            <div class="tagline">
                QR-Code Phishing Detection System
            </div>

        </div>

        <div class="title">

            <h1>Welcome Back</h1>

            <p>
                Sign in to access your security dashboard
            </p>

        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="field">

                <label for="username">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username or email"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>

            <button
                type="submit"
                class="login-btn">
                SIGN IN
            </button>

        </form>

        <div class="divider">

            <div class="divider-line"></div>

            <span>OR</span>

            <div class="divider-line"></div>

        </div>

        <a
            href="{{ url_for('google_login') }}"
            class="google-btn">

            <span class="google-icon">
                G
            </span>

            Continue with Google

        </a>

        <div class="register">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>

        <div class="security">

            🔒 <strong>Secure Access</strong><br>

            Your QRGuard account is protected by
            secure authentication.

        </div>

    </div>

</body>
</html>
```
